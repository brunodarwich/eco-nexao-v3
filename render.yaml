# Render Blueprint Specification for ECOnexão Backend (Render Native Python Service)
# ADR 0005: Provedor de Hospedagem e Runtime FastAPI (Render Native Python sem Docker)

services:
  - type: web
    name: econexao-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    plan: starter
    region: ohio
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: APP_NAME
        value: "ECOnexão API"
      - key: APP_ENV
        value: "staging"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://econexao.app","https://staging.econexao.app","http://localhost:8081","https://eco-nexao-v3.vercel.app"]'
      - key: ROUTING_PROVIDER
        value: "google_routes"
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: ENABLE_DYNAMIC_ROUTING
        value: "false"
      - key: DYNAMIC_ROUTING_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: GOOGLE_ROUTES_TIMEOUT_SECONDS
        value: "3.5"
      - key: GOOGLE_ROUTES_MAX_RETRIES
        value: "2"
      - key: GOOGLE_ROUTES_MONTHLY_ALERT_AT
        value: "7500"
      - key: GOOGLE_ROUTES_MONTHLY_LIMIT
        value: "9000"
