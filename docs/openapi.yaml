          - type: string
          - type: 'null'
          title: Connectivity
        cover_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Cover Image Url
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
