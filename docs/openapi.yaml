components:
  schemas:
    ActorCategoryListEnvelope:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ActorCategorySchema'
          title: Data
          type: array
      required:
      - data
      title: ActorCategoryListEnvelope
      type: object
    ActorCategorySchema:
      properties:
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon
        id:
          format: uuid
          title: Id
          type: string
        label:
          title: Label
          type: string
        slug:
          title: Slug
          type: string
        sort_order:
          default: 0
          title: Sort Order
          type: integer
      required:
      - id
      - label
      - slug
      - sort_order
      title: ActorCategorySchema
      type: object
    ActorDetailEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/ActorDetailSchema'
      required:
      - data
      title: ActorDetailEnvelope
      type: object
    ActorDetailSchema:
      properties:
        accessibility_features:
          items:
            additionalProperties: true
            type: object
          title: Accessibility Features
          type: array
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        category:
          $ref: '#/components/schemas/ActorCategorySchema'
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        google_place_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Google Place Id
        google_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Google Rating
        google_review_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Google Review Count
        green_badge_status:
          default: none
          title: Green Badge Status
          type: string
        id:
          format: uuid
          title: Id
          type: string
        instagram:
          anyOf:
          - type: string
          - type: 'null'
          title: Instagram
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        name:
          title: Name
          type: string
        opening_hours:
          additionalProperties: true
          title: Opening Hours
          type: object
        payment_methods:
          items: {}
          title: Payment Methods
          type: array
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        slug:
          title: Slug
          type: string
        state_code:
          anyOf:
          - type: string
          - type: 'null'
          title: State Code
        sub_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Category
        verification_status:
          default: unverified
          title: Verification Status
          type: string
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
      required:
      - accessibility_features
      - category
      - green_badge_status
      - id
      - name
      - opening_hours
      - payment_methods
      - slug
      - verification_status
      title: ActorDetailSchema
      type: object
    ActorListEnvelope:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ActorSummarySchema'
          title: Data
          type: array
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - meta
      title: ActorListEnvelope
      type: object
    ActorSummarySchema:
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        category_label:
          title: Category Label
          type: string
        category_slug:
          title: Category Slug
          type: string
        google_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Google Rating
        green_badge_status:
          default: none
          title: Green Badge Status
          type: string
        id:
          format: uuid
          title: Id
          type: string
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        name:
          title: Name
          type: string
        slug:
          title: Slug
          type: string
        verification_status:
          default: unverified
          title: Verification Status
          type: string
      required:
      - category_label
      - category_slug
      - green_badge_status
      - id
      - name
      - slug
      - verification_status
      title: ActorSummarySchema
      type: object
    AuthSessionEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/AuthUserSchema'
      required:
      - data
      title: AuthSessionEnvelope
      type: object
    AuthUserSchema:
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        id:
          format: uuid
          title: Id
          type: string
        is_anonymous:
          default: false
          title: Is Anonymous
          type: boolean
        role:
          default: authenticated
          title: Role
          type: string
      required:
      - id
      - is_anonymous
      - role
      title: AuthUserSchema
      type: object
    AvatarUploadRequest:
      properties:
        filename:
          title: Filename
          type: string
        mime_type:
          title: Mime Type
          type: string
      required:
      - filename
      - mime_type
      title: AvatarUploadRequest
      type: object
    AvatarUploadResponseData:
      properties:
        expires_in:
          default: 3600
          title: Expires In
          type: integer
        public_url:
          title: Public Url
          type: string
        storage_key:
          title: Storage Key
          type: string
        upload_url:
          title: Upload Url
          type: string
      required:
      - upload_url
      - storage_key
      - public_url
      - expires_in
      title: AvatarUploadResponseData
      type: object
    AvatarUploadResponseEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/AvatarUploadResponseData'
      required:
      - data
      title: AvatarUploadResponseEnvelope
      type: object
    BootstrapDataSchema:
      properties:
        active_region:
          anyOf:
          - $ref: '#/components/schemas/RegionSchema'
          - type: 'null'
        feature_flags:
          additionalProperties:
            type: boolean
          title: Feature Flags
          type: object
        supported_regions:
          items:
            $ref: '#/components/schemas/RegionSchema'
          title: Supported Regions
          type: array
      required:
      - feature_flags
      - supported_regions
      title: BootstrapDataSchema
      type: object
    BootstrapResponseEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/BootstrapDataSchema'
      required:
      - data
      title: BootstrapResponseEnvelope
      type: object
    ContactInfoSchema:
      properties:
        email:
          title: Email
          type: string
        operating_hours:
          title: Operating Hours
          type: string
        phone:
          title: Phone
          type: string
        whatsapp:
          title: Whatsapp
          type: string
      required:
      - email
      - phone
      - whatsapp
      - operating_hours
      title: ContactInfoSchema
      type: object
    EditorialInfoSchema:
      properties:
        last_updated:
          title: Last Updated
          type: string
        publisher:
          title: Publisher
          type: string
        version:
          title: Version
          type: string
      required:
      - version
      - last_updated
      - publisher
      title: EditorialInfoSchema
      type: object
    ErrorDetail:
      description: Detailed information about an API error.
      properties:
        code:
          example: NOT_FOUND
          title: Code
          type: string
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
        message:
          example: "O recurso solicitado n\xE3o foi encontrado."
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      description: Standard error response envelope.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          example: req_123456789
          title: Request Id
          type: string
      required:
      - error
      - request_id
      title: ErrorResponse
      type: object
    FAQItemSchema:
      properties:
        answer:
          title: Answer
          type: string
        category:
          title: Category
          type: string
        id:
          title: Id
          type: string
        question:
          title: Question
          type: string
      required:
      - id
      - question
      - answer
      - category
      title: FAQItemSchema
      type: object
