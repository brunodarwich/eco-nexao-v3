      parameters:
      - in: path
        name: route_id
        required: true
        schema:
          format: uuid
          title: Route Id
          type: string
      - description: Termo de busca por nome de ator
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Termo de busca por nome de ator
          title: Q
      - description: Slug da categoria do ator
        in: query
        name: category
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Slug da categoria do ator
          title: Category
      - description: UUID da origem
        in: query
        name: origin_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: UUID da origem
          title: Origin Id
      - description: "Cursor de pagina\xE7\xE3o (offset num\xE9rico)"
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "Cursor de pagina\xE7\xE3o (offset num\xE9rico)"
          title: Cursor
      - description: "Quantidade m\xE1xima de itens"
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: "Quantidade m\xE1xima de itens"
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorListEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Atores associados a uma rota
      tags:
      - Territorial - Routes
  /api/v1/routes/{route_id}/alerts:
    get:
      description: "Retorna alertas ativos e informativos associados \xE0 rota."
      operationId: get_route_alerts_api_v1_routes__route_id__alerts_get
      parameters:
      - in: path
        name: route_id
        required: true
        schema:
          format: uuid
          title: Route Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteAlertListEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Alertas ativos de uma rota
      tags:
      - Territorial - Routes
  /api/v1/routes/{route_id}/geometry:
