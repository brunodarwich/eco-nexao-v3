      description: "Retorna a taxonomia oficial de categorias de estabelecimentos\
        \ e atra\xE7\xF5es."
      operationId: list_actor_categories_api_v1_actor_categories_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorCategoryListEnvelope'
