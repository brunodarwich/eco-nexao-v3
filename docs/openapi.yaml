      description: "Retorna lista paginada de rotas tur\xEDsticas ativas com suporte\
        \ a busca e filtros."
      operationId: list_routes_api_v1_routes_get
      parameters:
      - description: "Filtrar por UUID da regi\xE3o"
        in: query
        name: region_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: "Filtrar por UUID da regi\xE3o"
          title: Region Id
      - description: "Termo de busca por t\xEDtulo ou resumo"
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "Termo de busca por t\xEDtulo ou resumo"
          title: Q
      - description: Filtrar rotas salvas
        in: query
        name: saved
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filtrar rotas salvas
          title: Saved
      - description: Filtrar rotas verificadas com selo
        in: query
        name: verified
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filtrar rotas verificadas com selo
          title: Verified
      - description: "Cursor de pagina\xE7\xE3o (offset num\xE9rico)"
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "Cursor de pagina\xE7\xE3o (offset num\xE9rico)"
          title: Cursor
      - description: "Quantidade m\xE1xima de itens"
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: "Quantidade m\xE1xima de itens"
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Listar rotas
      tags:
      - Territorial - Routes
  /api/v1/routes/{route_id}:
