      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthStatus:
      description: Health check response status model.
      properties:
        status:
          default: ok
          example: ok
          title: Status
          type: string
        timestamp:
          example: '2026-08-11T15:00:00Z'
          format: date-time
          title: Timestamp
          type: string
      required:
      - timestamp
      title: HealthStatus
      type: object
    HelpLinkSchema:
      properties:
        title:
