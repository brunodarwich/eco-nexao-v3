openapi: 3.1.0
info:
  title: ECOnexão API
  description: API de domínio do aplicativo ECOnexão para turismo sustentável e rotas
    ecológicas.
  version: 1.0.0
paths:
  /api/v1/admin/context:
    get:
      tags:
      - Admin
      summary: Obter contexto administrativo
      description: Expose only current editorial access; ordinary/anonymous users
        are denied.
      operationId: get_admin_context_api_v1_admin_context_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContextEnvelope'
        '401':
          description: JWT Supabase ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Identidade sem membership/capability editorial ativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/categories:
    get:
