        description: Incluir atores arquivados
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Buscar por nome ou slug
          title: Q
        description: Buscar por nome ou slug
      - name: limit
        in: query
        required: false
