          type: boolean
        text_scale:
          default: 1.0
          title: Text Scale
          type: number
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      title: UserPreferencesSchema
      type: object
    UserPreferencesUpdate:
      properties:
        active_region_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Active Region Id
        high_contrast:
          anyOf:
          - type: boolean
          - type: 'null'
          title: High Contrast
        locale:
          anyOf:
          - type: string
          - type: 'null'
          title: Locale
        screen_reader_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Screen Reader Mode
        text_scale:
          anyOf:
          - type: number
          - type: 'null'
          title: Text Scale
      title: UserPreferencesUpdate
      type: object
    UserProfileEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/UserProfileSchema'
      required:
      - data
      title: UserProfileEnvelope
      type: object
    UserProfileSchema:
      properties:
        avatar_media_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Avatar Media Id
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        id:
          format: uuid
          title: Id
          type: string
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        status:
          default: active
          title: Status
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - id
      title: UserProfileSchema
      type: object
    UserProfileUpdate:
      properties:
        avatar_media_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Avatar Media Id
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      title: UserProfileUpdate
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: "API de dom\xEDnio do aplicativo ECOnex\xE3o para turismo sustent\xE1\
    vel e rotas ecol\xF3gicas."
  title: "ECOnex\xE3o API"
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/actor-categories:
