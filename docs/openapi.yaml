      parameters:
      - in: path
        name: actor_id
        required: true
        schema:
          format: uuid
          title: Actor Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorDetailEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Detalhes de um ator
      tags:
      - Territorial - Actors
  /api/v1/auth/session:
    get:
      description: "Valida o token JWT Supabase e retorna os dados da sess\xE3o do\
        \ usu\xE1rio."
      operationId: get_auth_session_api_v1_auth_session_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: "Obter dados da sess\xE3o do usu\xE1rio autenticado"
      tags:
      - Auth
  /api/v1/auth/verify:
    post:
      description: "Verifica a validade, emissor, audi\xEAncia e assinatura assim\xE9\
        trica do token informado."
      operationId: verify_auth_token_api_v1_auth_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Validar token JWT Supabase
      tags:
      - Auth
  /api/v1/bootstrap:
    get:
      description: "Retorna informa\xE7\xF5es de inicializa\xE7\xE3o do aplicativo,\
        \ incluindo regi\xE3o ativa e feature flags."
      operationId: get_bootstrap_api_v1_bootstrap_get
      parameters:
      - description: "UUID da regi\xE3o preferida"
        in: query
        name: region_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: "UUID da regi\xE3o preferida"
          title: Region Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponseEnvelope'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Bootstrap do aplicativo
      tags:
      - Territorial - Regions
  /api/v1/content/support:
    get:
      description: Retorna FAQ, contatos editoriais e links de ajuda.
      operationId: get_support_content_api_v1_content_support_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportContentEnvelope'
          description: Successful Response
      summary: "Conte\xFAdo de suporte, ajuda e contatos editoriais"
      tags:
      - Content & Support
  /api/v1/health/live:
    get:
      description: Retorna status HTTP 200 se o processo FastAPI estiver executando.
      operationId: healthLive
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Successful Response
      summary: Liveness check
      tags:
      - Health
  /api/v1/health/ready:
    get:
      description: "Retorna status HTTP 200 se depend\xEAncias de banco de dados e\
