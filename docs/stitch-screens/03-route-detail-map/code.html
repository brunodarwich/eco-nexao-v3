<style>

        scrollbar-width: none;
    }
</style>
<script>
    // Data store for pin details
    const pinData = {
        'pin-1': {
            title: 'Restaurante Sabor Local',
            category: 'Alimentação',
            icon: 'restaurant',
            colorClass: 'text-tertiary-container',
            bgClass: 'bg-tertiary-container',
            description: 'Especializado em peixes regionais assados na brasa, servidos de frente para a praia. Ambiente rústico e acolhedor.',
            imageAlt: 'A cozy rustic restaurant patio overlooking a calm beach, wooden tables under a thatched roof, warm sunny afternoon lighting, cinematic wide shot, high contrast photography, natural earthy tones, green accents.',
            rating: '4.8',
            reviews: '124',
            actionText: 'Ver Menu'
        },
        'pin-2': {
            title: 'Pousada Recanto',
            category: 'Hospedagem',
            icon: 'bed',
            colorClass: 'text-primary-container',
            bgClass: 'bg-primary-container',
            description: 'Chalés confortáveis integrados à natureza. Café da manhã com tapioca fresca e frutas locais incluso na diária.',
            imageAlt: 'Cozy wooden chalets surrounded by lush tropical forest, a hammock hanging on the porch, dappled sunlight filtering through leaves, peaceful morning atmosphere, highly detailed architectural photography.',
            rating: '4.9',
            reviews: '89',
            actionText: 'Reservar'
        },
        'pin-3': {
            title: 'Mirante da Praia',
            category: 'Natureza',
            icon: 'landscape',
            colorClass: 'text-leaf-green',
            bgClass: 'bg-leaf-green',
            description: 'Ponto de observação perfeito para o pôr do sol. Acesso por uma trilha leve de 15 minutos partindo da praia principal.',
            imageAlt: 'A breathtaking panoramic view from a hilltop overlooking a wide river meeting the horizon. Golden hour sunset lighting casting warm hues over the water and surrounding green hills. Minimalist composition, deep shadows, crisp details.',
            rating: '5.0',
            reviews: '210',
            actionText: 'Como Chegar'
        }
    };

    const bottomSheet = document.getElementById('bottom-sheet');
    const sheetBackdrop = document.getElementById('sheet-backdrop');
    const sheetContent = document.getElementById('sheet-content');

    function openBottomSheet(pinId) {
        const data = pinData[pinId];
        if (!data) return;

        // Populate content
        sheetContent.innerHTML = `
            <div class="h-48 w-full rounded-lg mb-stack-md bg-cover bg-center shadow-sm relative overflow-hidden" 
                 style="background-image: url('placeholder')" 
                 data-alt="${data.imageAlt}">
                 <div class="absolute top-2 right-2 bg-surface-container-lowest/90 backdrop-blur px-2 py-1 rounded font-label-sm text-on-surface flex items-center gap-1 shadow-sm">
                     <span class="material-symbols-outlined text-[14px] text-warning" style="font-variation-settings: 'FILL' 1;">star</span>
                     ${data.rating} (${data.reviews})
                 </div>
            </div>
            
            <div class="flex items-center gap-2 mb-stack-sm">
                <span class="material-symbols-outlined text-[20px] ${data.colorClass}" style="font-variation-settings: 'FILL' 1;">${data.icon}</span>
                <span class="font-label-md text-on-surface-variant uppercase tracking-wider">${data.category}</span>
            </div>
            
            <h3 class="font-headline-md text-text-main mb-stack-sm">${data.title}</h3>
            
            <p class="font-body-md text-on-surface mb-stack-lg">${data.description}</p>
            
            <button class="w-full py-3 bg-primary-container text-on-primary rounded font-label-md text-center hover:bg-primary transition-colors flex justify-center items-center gap-2">
                ${data.actionText}
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        `;

        // Show sheet and backdrop
        sheetBackdrop.classList.remove('hidden');
        // trigger reflow
        void sheetBackdrop.offsetWidth;
        sheetBackdrop.classList.remove('opacity-0');
        sheetBackdrop.classList.add('opacity-100');
        
        bottomSheet.classList.remove('translate-y-full');
        bottomSheet.classList.add('translate-y-0');
    }

    function closeBottomSheet() {
        bottomSheet.classList.remove('translate-y-0');
        bottomSheet.classList.add('translate-y-full');
        
        sheetBackdrop.classList.remove('opacity-100');
        sheetBackdrop.classList.add('opacity-0');
        
        setTimeout(() => {
            sheetBackdrop.classList.add('hidden');
        }, 300); // match transition duration
    }
</script></main></body></html>
