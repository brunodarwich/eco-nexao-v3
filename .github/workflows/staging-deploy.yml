name: Staging Deployment & Migration Gate

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      trigger_smoke_only:
        description: "Executar apenas os testes de smoke contra staging"
        required: false
        type: boolean
        default: false
      apply_staging_migrations:
        description: "Autorizar aplicação de migrations pendentes em staging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff Linter & Formatter Check
        run: python -m ruff check app tests scripts

      - name: Mypy Strict Type Check
        run: python -m mypy app scripts

      - name: Migration Ordering Check
        run: python -m scripts.check_migrations

      - name: Security & RLS Policy Contract Tests
        run: >-
          python -m pytest
          tests/test_check_migrations.py
          tests/test_rls_policies.py
          tests/test_media_lifecycle_schema.py
          tests/test_staging_smoke.py
          tests/test_staging_migration_gate.py

      - name: Pytest Suite with Coverage (Minimum 85%)
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=85

  frontend-gate:
    name: Frontend Contract & Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: econexao-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: econexao-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI Types Sync
        run: npm run openapi:check

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Jest Test Suite
        run: npm test -- --watch=false

  migration-and-security-gate:
    name: Staging Migration & Secret Scan Gate
    needs: [backend-gate, frontend-gate]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies for gate scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Set up Node.js 22 for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify No Production Secrets in Codebase
        run: python backend/scripts/scan_secrets.py --root .

      - name: Execute Staging Migration Drift & Advisors Gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_STAGING_PROJECT_REF: ${{ secrets.EXPECTED_STAGING_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPLY_STAGING_MIGRATIONS: ${{ inputs.apply_staging_migrations || 'false' }}
        run: python backend/scripts/staging_migration_gate.py

  deploy-staging:
    name: Deploy to Render Staging
    needs: [migration-and-security-gate]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Staging Deploy Hook
        if: ${{ !inputs.trigger_smoke_only }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          python -c "
          import os, re, sys, urllib.request

          raw_hook = os.environ.get('RENDER_DEPLOY_HOOK', '').strip()
          match = re.search(r'https?://[^\s\"\'\[\]<>]+', raw_hook)
          if not match:
              print('::error::RENDER_STAGING_DEPLOY_HOOK_URL secret not configured or invalid URL. Failing closed.')
              sys.exit(1)

          clean_url = match.group(0)
          print(f'Triggering Render staging deployment webhook (https://api.render.com/deploy/...)...')
          req = urllib.request.Request(clean_url, data=b'', method='POST', headers={'User-Agent': 'econexao-ci/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f'Deployment webhook triggered successfully (HTTP {resp.status}).')
          except Exception as exc:
              print(f'::error::Failed to trigger Render deploy hook: {exc}')
              sys.exit(1)
          "

      - name: Set up Python for Smoke Test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Staging Smoke Verification
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_BASE_URL || 'https://econexao-backend-staging.onrender.com' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          python backend/scripts/staging_smoke.py --base-url "$STAGING_API_URL" --expected-commit "$EXPECTED_COMMIT_SHA" --max-retries 20 --delay 10
