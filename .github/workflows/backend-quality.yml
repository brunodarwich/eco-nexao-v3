name: Backend quality

on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests

      - name: Mypy
        run: python -m mypy app

      - name: Validate ordered Supabase migrations
        run: python -m scripts.check_migrations

      - name: Validate migration security contracts
        run: >-
          python -m pytest
          tests/test_check_migrations.py
          tests/test_rls_policies.py
          tests/test_media_lifecycle_schema.py

      - name: Tests, coverage, and secret scan
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=85
